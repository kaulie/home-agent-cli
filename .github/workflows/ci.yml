name: ci

# 构建冒烟（build smoke）—— 客户端 App 不是服务，所以这里只做「能不能编过」，
# 不签名、不装真机、不部署（部署平台里也没有本仓的服务）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: ios / ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      # 一个工程挂了不要掩盖其它工程的结果 —— 一次跑完看全貌。
      fail-fast: false
      matrix:
        app:
          - LivingRoomEdge
          - LivingRoomLegacy
          - LivingRoomPickup
          - HomeAgentAdmin
          - HomeAgentDev
          - HomeAgentPickup
          - HomeAgentRelay
    steps:
      - uses: actions/checkout@v4

      # 记录用的工具链版本（排错时先看这里）
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # 工程文件本身可读（.xcodeproj 与源码是否对得上）
      - name: List targets
        run: |
          xcodebuild -list \
            -project "ios/${{ matrix.app }}/${{ matrix.app }}.xcodeproj"

      # 只编译（不签名、不装真机）
      - name: Build (iOS Simulator, unsigned)
        run: |
          xcodebuild \
            -project "ios/${{ matrix.app }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # 显式钉住 SDK 包（compileSdk = 35）——不依赖 runner 镜像里预装了什么
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # :app-v2 的 sourceSets 跨到了顶层 plugins/（NetEaseMusicSkill /
      # ChromecastDisplaySkill）—— 本仓是 ios/ + android/ 的快照，没有这个目录。
      # 从主仓取一份 plugins/ 挂进来，让 CI 编的是真东西（零重复）。
      - name: Link plugins/ from home-agent-os
        run: |
          git clone --depth 1 https://github.com/kaulie/home-agent-os "$RUNNER_TEMP/home-agent-os"
          ln -s "$RUNNER_TEMP/home-agent-os/plugins" "$GITHUB_WORKSPACE/plugins"

      - name: Assemble debug APKs
        working-directory: android
        run: |
          ./gradlew --console=plain --no-daemon \
            :app:assembleDebug \
            :app-v2:assembleDebug \
            :living-room-android:assembleDebug

      # app-v2 里带了单元测试（如 NetEasePlayPolicyTest）
      - name: Unit tests (app-v2)
        working-directory: android
        run: ./gradlew --console=plain --no-daemon :app-v2:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: android/*/build/outputs/apk/debug/*.apk
          if-no-files-found: error
